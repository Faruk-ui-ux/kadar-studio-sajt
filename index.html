<div class="fm" role="dialog" aria-modal="true" aria-labelledby="fm-naslov" tabindex="-1">
<div class="fm-hd">
<button type="button" class="fm-x" aria-label="Zatvori formu" @click="fClose"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M4 4l12 12M16 4L4 16"></path></svg></button>
<p class="fm-kick">Zakazivanje</p>
<h2 id="fm-naslov" class="fm-h">Rezerviši termin</h2>
<template v-if="fShowForm">
<div class="fm-steps" aria-label="Koraci">
<span :class="fS1"><b>{{ fS1n }}</b>Snimanje</span><span class="fm-bar" aria-hidden="true"></span>
<span :class="fS2"><b>{{ fS2n }}</b>Termin</span><span class="fm-bar" aria-hidden="true"></span>
<span :class="fS3"><b>3</b>Podaci</span>
</div>
</template>
</div>
<template v-if="fShowForm">
<div>
<div class="fm-bd">

<template v-if="fStep1">
<div>
<p class="fm-q">Šta snimamo?</p>
<p class="fm-p">Izaberi vrstu snimanja, pa paket koji ti odgovara. Paket možeš ostaviti i otvorenim.</p>
<fieldset class="fm-set">
<legend class="fm-leg">Vrsta snimanja</legend>
<div class="fm-pills">
<template v-for="v in fVrste">
<button type="button" :class="v.cls" :aria-pressed="v.pressed" @click="v.pick">{{ v.label }}</button>
</template>
</div>
</fieldset>
<template v-if="fHasPaketi">
<fieldset class="fm-set">
<legend class="fm-leg">Paket</legend>
<div class="fm-pills">
<template v-for="q in fPaketi">
<button type="button" :class="q.cls" :aria-pressed="q.pressed" @click="q.pick">{{ q.label }}<small>{{ q.meta }}</small></button>
</template>
</div>
</fieldset>
</template>
</div>
</template>

<template v-if="fStep2">
<div>
<p class="fm-chip">{{ fChip }}<button type="button" @click="fGo1">promijeni</button></p>
<p class="fm-q">Kad ti odgovara?</p>
<p class="fm-p">Precrtani datumi su već rezervisani. Izaberi slobodan dan, pa idemo na zadnji korak.</p>
<div class="cal">
<div class="cal-top">
<p class="cal-m" aria-live="polite">{{ calMjesec }}</p>
<button type="button" :class="calPrevCls" aria-label="Prethodni mjesec" @click="calPrev"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3L5 8l5 5"></path></svg></button>
<button type="button" class="cal-nav" aria-label="Sljedeći mjesec" @click="calNext"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3l5 5-5 5"></path></svg></button>
</div>
<div class="cal-w" aria-hidden="true"><span>Pon</span><span>Uto</span><span>Sri</span><span>Čet</span><span>Pet</span><span>Sub</span><span>Ned</span></div>
<div class="cal-grid" role="group" aria-label="Izaberi datum">
<template v-for="d in calDani">
<button type="button" :class="d.cls" :tabindex="d.tab" :aria-label="d.aria" :aria-pressed="d.sel" @click="d.pick">{{ d.n }}</button>
</template>
</div>
<div class="cal-leg"><span class="cal-k cal-k-f" aria-hidden="true"></span>Slobodno<span class="cal-k cal-k-b" aria-hidden="true"></span>Rezervisano<span class="cal-k cal-k-s" aria-hidden="true"></span>Izabrano</div>
<p class="cal-pick" aria-live="polite">{{ calIzabrano }}</p>
<button type="button" class="cal-skip" @click="fSkipDatum">Nemam još tačan datum</button>
</div>
</div>
</template>

<template v-if="fStep3">
<div>
<p class="fm-chip">{{ fChip2 }}<button type="button" @click="fGo2">promijeni</button></p>
<p class="fm-q">Kako da te dobijem?</p>
<p class="fm-p">Upit stiže direktno meni. Javljam se u roku od 24 sata s potvrdom termina.</p>
<div class="fm-row">
<div class="fm-field"><label class="fm-lab" for="fm-ime">Ime i prezime</label><input id="fm-ime" class="fm-in" type="text" autocomplete="name" placeholder="Amra Hodžić" :value="fIme" @input="fOnIme"></div>
<div class="fm-field"><label class="fm-lab" for="fm-kontakt">Telefon ili email</label><input id="fm-kontakt" class="fm-in" type="text" autocomplete="tel" placeholder="061 000 000" :value="fKontakt" @input="fOnKontakt"></div>
</div>
<div class="fm-field"><label class="fm-lab" for="fm-poruka">Poruka</label><textarea id="fm-poruka" class="fm-in" rows="3" placeholder="Lokacija, broj ljudi, ideja za snimanje..." :value="fPoruka" @input="fOnPoruka"></textarea></div>

</div>
</template>

<template v-if="fErr"><p class="fm-err" role="alert">{{ fErr }}</p></template>
</div>
<div class="fm-ft">
<p class="fm-cnt">{{ fCnt }}</p>
<div class="fm-act">
<template v-if="fCanBack"><button type="button" class="fm-b fm-b2" @click="fPrev">Nazad</button></template>
<template v-if="fLast"><button type="button" class="fm-b fm-b2" @click="sendMail">Email</button></template>
<template v-if="fLast"><button type="button" class="fm-b fm-b1" @click="sendWa">Pošalji na WhatsApp<svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 8h10M9 4.5L12.5 8 9 11.5"></path></svg></button></template>
<template v-if="fNotLast"><button type="button" class="fm-b fm-b1" @click="fNext">Dalje<svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 8h10M9 4.5L12.5 8 9 11.5"></path></svg></button></template>
</div>
</div>
</div>
</template>
<template v-if="fDone">
<div class="fm-done">
<p class="fm-q">Hvala, {{ fImeKratko }}.</p>
<p class="fm-p">Upit je otvoren u WhatsAppu ili mail aplikaciji. Kad ga tamo pošalješ, javljam ti se u roku od 24 sata.</p>
<div class="fm-act">
<a class="fm-b fm-b1" :href="fWa" target="_blank" rel="noopener">Otvori WhatsApp</a>
<a class="fm-b fm-b2" :href="fMl">Otvori email</a>
</div>
<p class="fm-note"><button type="button" @click="fBackToForm">Vrati se na formu</button> &nbsp;·&nbsp; <button type="button" @click="fClose">Zatvori</button></p>
</div>
</template>
</div>
</div>
</template>

</div>
</template>
<script src="js/vue.global.prod.js"></script>
<script src="js/app.js"></script>
</body>
</html>
